name: Neural research runtime
description: Reproducible CPU learning and shogi rule dependencies
runs:
  using: composite
  steps:
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
        cache: pip
        cache-dependency-path: research/neural-distributed/requirements.txt
    - shell: bash
      run: python3 -m pip install -r research/neural-distributed/requirements.txt
