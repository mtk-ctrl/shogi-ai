name: Build Android OEX APK

# Full milestone/release validation. Ordinary strategy development stays on quick-ci.
# android/VERSION or RELEASE_TRIGGER explicitly requests a complete inspection.
# The workflow is split so progress and failures are visible without opening raw logs.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "android/VERSION"
      - "android/RELEASE_TRIGGER"
      - ".github/workflows/android-apk.yml"

permissions:
  contents: read

concurrency:
  group: kumoji-android-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Full validation
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Prepare host test environment
        run: |
          python3 -m pip install python-shogi==1.1.1
          python3 scripts/build.py

      - name: Rules boundary and legal-move validation
        run: |
          python3 scripts/build.py --test --output build/rules-test
          ./build/rules-test
          python3 tests/differential.py build/rules-test
          python3 tests/check_boundary.py build/shogi-ai

      - name: USI protocol and Experience Cache
        run: |
          python3 tests/test_usi.py build/shogi-ai
          python3 tests/test_experience_cache.py build/shogi-ai

      - name: Search, quiescence and mate validation
        run: |
          python3 scripts/build.py --strategy-test --output build/strategy-test
          ./build/strategy-test
          python3 scripts/build.py --search-test --output build/search-test
          ./build/search-test
          python3 scripts/build.py --quiescence-test --output build/quiescence-test
          ./build/quiescence-test
          python3 scripts/build.py --mate-search-test --output build/mate-search-test
          ./build/mate-search-test
          python3 scripts/build.py --mate-assist-test --output build/mate-assist-test
          ./build/mate-assist-test
          python3 tests/test_search_usi.py build/shogi-ai
          python3 tests/test_mate_usi.py build/shogi-ai

      - name: Opening book, ordering and arena validation
        run: |
          python3 scripts/build.py --opening-book-test --output build/opening-book-test
          ./build/opening-book-test
          python3 tests/test_embedded_book_usi.py build/shogi-ai
          python3 scripts/build.py --ordering-test --output build/ordering-test
          ./build/ordering-test
          python3 scripts/build.py --contact-ordering-test --output build/contact-ordering-test
          ./build/contact-ordering-test
          python3 tests/test_arena.py

      - name: Evaluation validation
        run: |
          python3 scripts/build.py --evaluation-test --output build/evaluation-test
          ./build/evaluation-test
          python3 scripts/build.py --evaluation-probe --output build/evaluation-probe
          python3 tests/test_attacks.py build/evaluation-probe
          python3 tests/test_eval_fixtures.py build/evaluation-probe
          python3 tests/test_eval_usi.py build/shogi-ai

      - name: Sanitizer full inspection
        run: |
          python3 scripts/build.py --evaluation-test --sanitize --output build/evaluation-sanitized
          ./build/evaluation-sanitized
          python3 scripts/build.py --strategy-test --sanitize --output build/strategy-sanitized
          ./build/strategy-sanitized
          python3 scripts/build.py --ordering-test --sanitize --output build/ordering-sanitized
          ./build/ordering-sanitized
          python3 scripts/build.py --contact-ordering-test --sanitize --output build/contact-ordering-sanitized
          ./build/contact-ordering-sanitized
          python3 scripts/build.py --test --sanitize --output build/rules-sanitized
          ./build/rules-sanitized

  apk:
    name: Build, sign and publish APK
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Check preinstalled Android SDK
        run: |
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          test -x "$SDKMANAGER"
          "$SDKMANAGER" --version

      - name: Install Android SDK and NDK
        run: |
          SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;28.2.13676358"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.5.0"

      - name: Read Android version
        id: version
        run: |
          echo "name=$(sed -n '1p' android/VERSION)" >> "$GITHUB_OUTPUT"
          echo "code=$(sed -n '2p' android/VERSION)" >> "$GITHUB_OUTPUT"

      - name: Apply Android and OEX version
        env:
          VERSION_NAME: ${{ steps.version.outputs.name }}
          VERSION_CODE: ${{ steps.version.outputs.code }}
        run: |
          python3 - <<'PY'
          import os, re
          from pathlib import Path

          gradle = Path("android/app/build.gradle.kts")
          text = gradle.read_text()
          text, n1 = re.subn(r'versionCode = \d+', f'versionCode = {os.environ["VERSION_CODE"]}', text, count=1)
          text, n2 = re.subn(r'versionName = "[^"]+"', f'versionName = "{os.environ["VERSION_NAME"]}"', text, count=1)
          if n1 != 1 or n2 != 1:
              raise SystemExit("Android version fields not found exactly once")
          gradle.write_text(text)

          engines = Path("android/app/src/main/res/xml/enginelist.xml")
          text = engines.read_text()
          text, n3 = re.subn(
              r'name="雲路 KUMOJI v[^"]+"',
              f'name="雲路 KUMOJI v{os.environ["VERSION_NAME"]}"',
              text,
              count=1,
          )
          if n3 != 1:
              raise SystemExit("OEX engine version field not found exactly once")
          engines.write_text(text)
          PY
          grep -E 'versionCode|versionName' android/app/build.gradle.kts
          grep 'name="' android/app/src/main/res/xml/enginelist.xml

      - name: Build ARM64 USI engine
        run: |
          NDK="$ANDROID_SDK_ROOT/ndk/28.2.13676358"
          CXX="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android24-clang++"
          mkdir -p android/app/src/main/jniLibs/arm64-v8a
          python3 scripts/build.py --cxx "$CXX" --android \
            --output android/app/src/main/jniLibs/arm64-v8a/libshogiai.so
          file android/app/src/main/jniLibs/arm64-v8a/libshogiai.so

      - name: Prepare fixed development signing key
        run: bash scripts/make_dev_keystore.sh

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Verify fixed development signature
        id: signature
        run: |
          APK="android/app/build/outputs/apk/debug/app-debug.apk"
          APKSIGNER="$ANDROID_SDK_ROOT/build-tools/36.0.0/apksigner"
          ACTUAL="$($APKSIGNER verify --print-certs "$APK" | sed -n 's/Signer #1 certificate SHA-256 digest: //p' | tr '[:lower:]' '[:upper:]')"
          EXPECTED="$(tr -d '\r\n' < android/signing/DEV_CERT_SHA256.txt)"
          echo "certificate SHA-256: $ACTUAL"
          test "$ACTUAL" = "$EXPECTED"
          echo "sha256=$ACTUAL" >> "$GITHUB_OUTPUT"

      - name: Prepare APK and release-ready manifest
        id: artifact
        env:
          VERSION_NAME: ${{ steps.version.outputs.name }}
          VERSION_CODE: ${{ steps.version.outputs.code }}
          CERT_SHA256: ${{ steps.signature.outputs.sha256 }}
        run: |
          mkdir -p dist
          APK_NAME="KUMOJI-v${VERSION_NAME}-fixed-debug.apk"
          cp android/app/build/outputs/apk/debug/app-debug.apk "dist/$APK_NAME"
          APK_SHA256="$(sha256sum "dist/$APK_NAME" | awk '{print $1}')"
          export APK_NAME APK_SHA256
          python3 - <<'PY'
          import json, os
          from pathlib import Path

          manifest = {
              "status": "READY",
              "engine": "雲路 KUMOJI",
              "version": os.environ["VERSION_NAME"],
              "version_code": int(os.environ["VERSION_CODE"]),
              "commit": os.environ["GITHUB_SHA"],
              "apk": os.environ["APK_NAME"],
              "apk_sha256": os.environ["APK_SHA256"],
              "certificate_sha256": os.environ["CERT_SHA256"],
          }
          Path("dist/release-ready.json").write_text(
              json.dumps(manifest, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )
          print(json.dumps(manifest, ensure_ascii=False, indent=2))
          PY
          echo "apk_name=$APK_NAME" >> "$GITHUB_OUTPUT"
          echo "apk_sha256=$APK_SHA256" >> "$GITHUB_OUTPUT"

      - name: Upload APK and release-ready manifest
        uses: actions/upload-artifact@v4
        with:
          name: KUMOJI-v${{ steps.version.outputs.name }}-READY
          path: dist/
          if-no-files-found: error

      - name: RELEASE READY - APK uploaded
        env:
          VERSION_NAME: ${{ steps.version.outputs.name }}
          APK_NAME: ${{ steps.artifact.outputs.apk_name }}
          APK_SHA256: ${{ steps.artifact.outputs.apk_sha256 }}
        run: |
          test -f dist/release-ready.json
          test -f "dist/$APK_NAME"
          {
            echo "## RELEASE READY"
            echo "- Engine: 雲路 KUMOJI"
            echo "- Version: $VERSION_NAME"
            echo "- Commit: $GITHUB_SHA"
            echo "- APK: $APK_NAME"
            echo "- APK SHA-256: $APK_SHA256"
          } >> "$GITHUB_STEP_SUMMARY"
