name: Tactical Feature Study (research, temporary)
# Research only (branch-only). Tests whether candidate non-king features add information beyond
# the current evaluation, on finished self-play games (own games only).
on:
  push:
    branches: [research/tactical-features-20261108]
permissions:
  actions: read
  contents: read
jobs:
  study:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install numpy scipy python-shogi
      - run: python3 scripts/build.py --tactical-probe --output build/tact_probe
      - name: Download shards
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_IDS: "42443137600 42443155663 42446927414 42449420368"
        run: |
          for id in $RUN_IDS; do gh run download "$id" -R "$GITHUB_REPOSITORY" -p "generic-engine-match-$id-*" -D shards/$id; done
          i=0; for f in $(find shards -name 'shard-*.json' | sort); do i=$((i+1)); cp "$f" "shards/g$i.json"; done
      - name: Dataset and study
        env:
          SEL: "0,1,3,6,8,9"
          FEATURE_NAMES: supported_drop_spots_r2,gold_silver_adjacent,defender_value_near,attacker_value_near,pawn_shield,empty_in_front,second_ring_free,max_ring_attack,edge_or_back,enemy_gold_silver_hand,enemy_rook_bishop_hand,enemy_knight_hand
        run: |
          python3 research/eval-tuning/build_dataset.py shards/g*.json --output data.tsv --min-ply 8
          python3 research/eval-tuning/feature_test.py data.tsv build/tact_probe 20 | tee study.log
          python3 - <<'PY'
          txt = open("study.log", encoding="utf-8").read()
          print("::notice title=study.log::" + txt.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A"))
          PY
