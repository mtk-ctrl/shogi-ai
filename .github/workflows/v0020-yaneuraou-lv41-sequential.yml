name: v0.0.20 YaneuraOu Lv41 Sequential

on:
  push:
    branches: [v0020-ordering-diagnostics]
    paths:
      - ".github/workflows/v0020-yaneuraou-lv41-sequential.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  YANEURAOU_REF: c1b80eaa09fe13d5f12b1599d1ae4d53c224de30

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          ref: v0020-ordering-diagnostics
      - run: python3 -m pip install python-shogi==1.1.1
      - name: Build engines
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/build.py --output build/shogi-ai
          git clone --filter=blob:none https://github.com/yaneurao/YaneuraOu.git external/YaneuraOu
          git -C external/YaneuraOu checkout "$YANEURAOU_REF"
          make -C external/YaneuraOu/source clean COMPILER=g++ TARGET_CPU=SSE42 YANEURAOU_EDITION=YANEURAOU_ENGINE_MATERIAL MATERIAL_LEVEL=1
          make -C external/YaneuraOu/source -j2 tournament COMPILER=g++ TARGET_CPU=SSE42 YANEURAOU_EDITION=YANEURAOU_ENGINE_MATERIAL MATERIAL_LEVEL=1
      - name: Run exact sequential Lv41 screen
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p benchmarks/external-results/v0020-lv41-sequential
          python3 benchmarks/external_match.py \
            --self-engine build/shogi-ai \
            --opponent-engine external/YaneuraOu/source/YaneuraOu-by-gcc \
            --self-options '{"ExperienceCache":"false","OpeningBook":"false"}' \
            --opponent-options '{"Threads":1,"USI_Hash":16,"USI_OwnBook":false}' \
            --self-go 'go movetime 50' \
            --opponent-go 'go nodes 1048' \
            --games 20 --max-plies 400 --seed 20261005 \
            --output benchmarks/external-results/v0020-lv41-sequential/result.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path('benchmarks/external-results/v0020-lv41-sequential/result.json')
          r=json.loads(p.read_text())
          out={'games':r['games'],'wins':r['wins_self'],'draws':r['draws'],'losses':r['losses_self'],'score':r['score_self'],'illegal_games':r['illegal_games'],'self_mean_ms':r['timing']['self']['mean_ms']}
          Path('benchmarks/external-results/v0020-lv41-sequential/summary.json').write_text(json.dumps(out,indent=2)+'\n')
          print(json.dumps(out,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v0020-lv41-sequential-${{ github.run_id }}
          path: benchmarks/external-results/v0020-lv41-sequential
          retention-days: 14
