name: Engine Match Request Launcher

on:
  push:
    branches: [main]
    paths:
      - ".github/match-request.json"
  workflow_dispatch:
  issues:
    types: [opened]

permissions:
  contents: read
  actions: write

jobs:
  dispatch:
    if: >-
      github.event_name != 'issues' ||
      (github.event.issue.user.login == github.repository_owner &&
       startsWith(github.event.issue.title, '[KUMOJI MATCH] '))
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Validate request and dispatch Generic Engine Match
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/dispatch_match_request.py
