name: Document Rule Consistency

on:
  push:
    branches: [main]
    paths:
      - "AGENTS.md"
      - "README.md"
      - "docs/**"
      - ".github/workflows/**"
      - "scripts/check_doc_router.py"
      - "scripts/check_workflow_inventory.py"
      - "scripts/check_match_workflows.py"
      - "tests/test_match_workflow_guard.py"
      - "scripts/check_current_claims.py"
      - "tests/test_document_consistency.py"
  pull_request:
    paths:
      - "AGENTS.md"
      - "README.md"
      - "docs/**"
      - ".github/workflows/**"
      - "scripts/check_doc_router.py"
      - "scripts/check_workflow_inventory.py"
      - "scripts/check_match_workflows.py"
      - "tests/test_match_workflow_guard.py"
      - "scripts/check_current_claims.py"
      - "tests/test_document_consistency.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Test document consistency checks
        run: python3 tests/test_document_consistency.py

      - name: Check router and active rules
        run: python3 scripts/check_doc_router.py

      - name: Check active workflow inventory
        run: python3 scripts/check_workflow_inventory.py

      - name: Test match workflow guard
        run: python3 tests/test_match_workflow_guard.py

      - name: Preflight match and research workflows
        run: python3 scripts/check_match_workflows.py

      - name: Check current-state claims
        run: python3 scripts/check_current_claims.py
