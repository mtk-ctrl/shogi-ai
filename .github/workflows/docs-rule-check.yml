name: Document Rule Consistency

on:
  push:
    branches: [main]
    paths:
      - "AGENTS.md"
      - "README.md"
      - "docs/**"
      - ".github/workflows/**"
      - "scripts/check_doc_router.py"
      - "scripts/check_workflow_inventory.py"
      - "scripts/check_current_claims.py"
  pull_request:
    paths:
      - "AGENTS.md"
      - "README.md"
      - "docs/**"
      - ".github/workflows/**"
      - "scripts/check_doc_router.py"
      - "scripts/check_workflow_inventory.py"
      - "scripts/check_current_claims.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Check router and active rules
        run: python3 scripts/check_doc_router.py

      - name: Check active workflow inventory
        run: python3 scripts/check_workflow_inventory.py

      - name: Check current-state claims
        run: python3 scripts/check_current_claims.py
