name: 200ms Plus Ten Long Thinks

on:
  push:
    branches:
      - research/time-allocation-sweep
    paths:
      - ".github/workflows/200ms-plus-ten-long-thinks.yml"

permissions:
  contents: read

concurrency:
  group: 200ms-plus-ten-long-thinks
  cancel-in-progress: false

jobs:
  compare:
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: total-1s-x10
            bonus_ms: 1000
          - id: total-1p2s-x10
            bonus_ms: 1200
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout research branch
        uses: actions/checkout@v5

      - name: Install dependency
        run: python3 -m pip install python-shogi==1.1.1

      - name: Build engine
        run: python3 scripts/build.py --output build/shogi-ai

      - name: Verify runner
        run: python3 tests/test_bonus_time.py build/shogi-ai

      - name: Run 100-game comparison
        run: |
          python3 benchmarks/bonus_time_match.py \
            --engine build/shogi-ai \
            --policy adaptive \
            --pairs 50 \
            --workers 4 \
            --seed 2026100637 \
            --normal-ms 200 \
            --baseline-ms 200 \
            --bonus-ms "${{ matrix.bonus_ms }}" \
            --max-bonus-uses 10 \
            --output "benchmarks/results/2026-10-06_200ms-plus-ten/${{ matrix.id }}"

      - name: Validate and analyze
        run: |
          python3 benchmarks/analyze_bonus_time.py "benchmarks/results/2026-10-06_200ms-plus-ten/${{ matrix.id }}"
          cat "benchmarks/results/2026-10-06_200ms-plus-ten/${{ matrix.id }}/summary.json"
          cat "benchmarks/results/2026-10-06_200ms-plus-ten/${{ matrix.id }}/analysis.json"

      - name: Upload experiment records
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: 200ms-plus-ten-${{ matrix.id }}-${{ github.run_id }}
          path: "benchmarks/results/2026-10-06_200ms-plus-ten/${{ matrix.id }}"
          retention-days: 30
          if-no-files-found: warn
