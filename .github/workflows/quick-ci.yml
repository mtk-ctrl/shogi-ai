name: Quick Strategy CI

on:
  push:
    branches: ["**"]
    paths:
      - "engine/strategy/**"
      - "engine/main.cpp"
      - "engine/rules/**"
      - "position-knowledge-v1.tsv"
      - "position-knowledge-v1.manifest.json"
      - "tools/knowledge/**"
      - "tests/strategy_test.cpp"
      - "tests/ordering_test.cpp"
      - "tests/contact_ordering_test.cpp"
      - "tests/search_test.cpp"
      - "tests/quiescence_test.cpp"
      - "tests/mate_search_test.cpp"
      - "tests/mate_assist_test.cpp"
      - "tests/rules_test.cpp"
      - "tests/generated_move_test.cpp"
      - "tests/test_search_usi.py"
      - "tests/test_position_knowledge_usi.py"
      - "tests/test_eval_usi.py"
      - "tests/test_phase_diagnostics.py"
      - "tools/phase/**"
      - "tests/test_mate_usi.py"
      - "benchmarks/arena.py"
      - "benchmarks/position_arena.py"
      - "benchmarks/external_match.py"
      - "tools/floodgate/**"
      - "tests/test_floodgate_client.py"
      - "tests/test_arena.py"
      - "tests/test_match_sharding.py"
      - "tests/test_external_match.py"
      - "scripts/build.py"
      - ".github/workflows/quick-ci.yml"
  workflow_dispatch:

concurrency:
  group: quick-strategy-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quick:
    if: ${{ github.ref != 'refs/heads/research/2026-10-10-phase-maturity-check' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Build engine
        run: python3 scripts/build.py --output build/shogi-ai

      - name: Strategy tests
        run: |
          python3 scripts/build.py --strategy-test --output build/strategy-test
          ./build/strategy-test

      - name: Move ordering tests
        run: |
          python3 scripts/build.py --ordering-test --output build/ordering-test
          ./build/ordering-test
          python3 scripts/build.py --contact-ordering-test --output build/contact-ordering-test
          ./build/contact-ordering-test

      - name: Iterative search tests
        run: |
          python3 scripts/build.py --search-test --output build/search-test
          ./build/search-test
          python3 scripts/build.py --quiescence-test --output build/quiescence-test
          ./build/quiescence-test

      - name: Rules and generated-move fast-path tests
        run: |
          python3 scripts/build.py --test --output build/rules-test
          ./build/rules-test
          python3 scripts/build.py --generated-move-test --output build/generated-move-test
          ./build/generated-move-test

      - name: Bounded mate search tests
        run: |
          python3 scripts/build.py --mate-search-test --output build/mate-search-test
          ./build/mate-search-test

      - name: Ordinary-go mate assist tests
        run: |
          python3 scripts/build.py --mate-assist-test --output build/mate-assist-test
          ./build/mate-assist-test

      - name: USI score time-control and mate tests
        run: |
          python3 -m pip install python-shogi==1.1.1
          python3 tests/test_search_usi.py build/shogi-ai
          python3 tests/test_position_knowledge_usi.py build/shogi-ai
          python3 tests/test_eval_usi.py build/shogi-ai
          python3 tests/test_mate_usi.py build/shogi-ai

      - name: Phase diagnostics and historical game filter
        run: |
          python3 scripts/build.py --phase-probe --output build/phase-probe
          python3 tests/test_phase_diagnostics.py build/phase-probe
          python3 tools/phase/analyze_games.py \
            --input benchmarks/results/2026-10-05_v019-mate-assist-50ms-100games.json \
            --engine build/phase-probe --output build/phase-report.json

      - name: Relative terminal-stage correlation research
        run: |
          python3 tools/phase/correlate_terminal_ply.py \
            --input benchmarks/results/2026-10-05_v019-mate-assist-50ms-100games.json \
            --input benchmarks/results/2026-10-05_v019-mate-assist-50ms-100games-run2.json \
            --probe build/phase-probe --output build/relative-stage-report.json

      - name: Research maturity, king urgency and branching against historical games
        run: |
          python3 tools/phase/compare_maturity.py \
            --input benchmarks/results/2026-10-05_v019-mate-assist-50ms-100games.json \
            --input benchmarks/results/2026-10-05_v019-mate-assist-50ms-100games-run2.json \
            --probe build/phase-probe --output build/maturity-report.json

      - name: Arena telemetry and adjudication tests
        run: |
          python3 tests/test_arena.py
          python3 tests/test_match_sharding.py
          python3 tests/test_external_match.py
          python3 tests/test_floodgate_client.py

      - name: Floodgate bridge dry-run
        run: python3 tools/floodgate/client.py --engine build/shogi-ai

  phase-research:
    if: ${{ github.ref == 'refs/heads/research/2026-10-10-phase-maturity-check' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout research branch
        uses: actions/checkout@v5
      - name: Install chess-board parser
        run: python3 -m pip install python-shogi==1.1.1
      - name: Build independent position diagnostic
        run: python3 scripts/build.py --phase-probe --output build/phase-probe
      - name: Measure stage agreement against 166 archived games
        run: |
          python3 tools/phase/compare_maturity.py \
            --input benchmarks/results/2026-10-05_v019-mate-assist-50ms-100games.json \
            --input benchmarks/results/2026-10-05_v019-mate-assist-50ms-100games-run2.json \
            --probe build/phase-probe --output build/maturity-report.json
      - name: Tune added indicators with separate train validation and test games
        run: |
          python3 tools/phase/fit_maturity.py \
            --input benchmarks/results/2026-10-05_v019-mate-assist-50ms-100games.json \
            --input benchmarks/results/2026-10-05_v019-mate-assist-50ms-100games-run2.json \
            --probe build/phase-probe --output build/maturity-tuned.json
      - name: Save reproducible result
        uses: actions/upload-artifact@v4
        with:
          name: phase-maturity-research
          path: |
            build/maturity-report.json
            build/maturity-tuned.json
          retention-days: 30
