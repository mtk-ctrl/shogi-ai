name: Evaluation V2 Full Ladder Book Experience

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

env:
  YANEURAOU_REF: c1b80eaa09fe13d5f12b1599d1ae4d53c224de30

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - run: python3 -m pip install python-shogi==1.1.1
      - name: Build KUMOJI
        run: python3 scripts/build.py --output build/kumoji
      - name: Build pinned YaneuraOu Material
        run: |
          git clone --filter=blob:none https://github.com/yaneurao/YaneuraOu.git external/YaneuraOu
          git -C external/YaneuraOu checkout "$YANEURAOU_REF"
          make -C external/YaneuraOu/source clean COMPILER=g++ TARGET_CPU=SSE42 YANEURAOU_EDITION=YANEURAOU_ENGINE_MATERIAL MATERIAL_LEVEL=1
          make -C external/YaneuraOu/source -j2 tournament COMPILER=g++ TARGET_CPU=SSE42 YANEURAOU_EDITION=YANEURAOU_ENGINE_MATERIAL MATERIAL_LEVEL=1
      - uses: actions/upload-artifact@v4
        with:
          name: full-ladder-runtime
          path: |
            build/kumoji
            external/YaneuraOu/source/YaneuraOu-by-gcc

  level:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        level: [40, 45, 48, 49, 50, 55]
        lane: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@v5
      - run: python3 -m pip install python-shogi==1.1.1
      - uses: actions/download-artifact@v4
        with:
          name: full-ladder-runtime
          path: build/runtime
      - name: Run 25 games in one persistent Experience lane
        shell: bash
        run: |
          set -euo pipefail
          ENGINE="$(find build/runtime -type f -name kumoji | head -1)"
          YANE="$(find build/runtime -type f -name YaneuraOu-by-gcc | head -1)"
          chmod +x "$ENGINE" "$YANE"
          LEVEL="${{ matrix.level }}"
          LANE="${{ matrix.lane }}"
          NODES="$(python3 benchmarks/external_levels.py --level "$LEVEL" --nodes-only)"
          mkdir -p "build/L$LEVEL/lane$LANE"
          EXP="build/L$LEVEL/lane$LANE/experience.bin"
          OUT="build/L$LEVEL/lane$LANE/result.json"
          SEED=$((2026107000 + LEVEL * 100 + LANE * 25))
          SELF_OPTIONS="$(python3 - "$EXP" <<'PY'
          import json,sys
          print(json.dumps({
            "EvalV2":True,"EvalMaterialWeight":100,"EvalSafety":500,
            "EvalPressure":474,"EvalActivity":150,"EvalDanger":200,
            "EvalInfluence":19,"EvalPotential":25,"EvalCoordination":50,
            "EvalHandPotential":60,"EvalThreat":0,"EvalPositionalCap":5000,
            "OpeningBook":True,"OpeningBookFile":"shogi-ai-book.tsv",
            "ExperienceCache":True,"ExperienceFile":sys.argv[1],
            "AdaptiveLongThink":True,"MateAssist":True
          },separators=(",",":")))
          PY
          )"
          python3 benchmarks/external_match.py \
            --self-engine "$ENGINE" --opponent-engine "$YANE" \
            --self-options "$SELF_OPTIONS" \
            --opponent-options '{"Threads":1,"USI_Hash":16,"USI_OwnBook":false}' \
            --self-go "go movetime 200" --opponent-go "go nodes $NODES" \
            --games 25 --max-plies 300 --seed "$SEED" --output "$OUT"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: full-ladder-L${{ matrix.level }}-lane${{ matrix.lane }}
          path: build/L${{ matrix.level }}/lane${{ matrix.lane }}
          if-no-files-found: error
          retention-days: 180

  analyze:
    needs: [prepare, level]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          pattern: full-ladder-L*
          path: build/all
      - name: Aggregate
        run: |
          python3 - <<'PY'
          import json,math
          from pathlib import Path
          levels=[40,45,48,49,50,55]
          all_docs=[json.loads(p.read_text()) for p in Path("build/all").rglob("result.json")]
          lines=["# KUMOJI v2 Book+Experience ladder","",
                 "- 100 games/level","- 4 persistent Experience lanes × 25 games/level",
                 "- OpeningBook ON","- ExperienceCache ON + persisted",
                 "- runner policy: one lane per Actions job; no max-parallel cap; GitHub fills all currently free runner slots",
                 "- go movetime 200 + AdaptiveLongThink ON","",
                 "| Level | W-D-L | score | 95% CI |","|---:|---:|---:|---:|"]
          payload={"levels":levels,"games_per_level":100,"results":{}}
          for lv in levels:
              ds=[d for d in all_docs if int(d["self_engine"]["options"].get("EvalSafety","0"))==500 and d["games"]==25 and f"level{lv:03d}" in str(d.get("output",""))]
              if not ds:
                  # Artifact path, not result payload, identifies level; recover via parent names.
                  ds=[]
                  for p in Path("build/all").rglob("result.json"):
                      if f"L{lv}-lane" in str(p):
                          ds.append(json.loads(p.read_text()))
              if len(ds)!=4: raise SystemExit(f"L{lv}: expected 4 lanes, got {len(ds)}")
              n=sum(d["games"] for d in ds); w=sum(d["wins_self"] for d in ds)
              dr=sum(d["draws"] for d in ds); l=sum(d["losses_self"] for d in ds)
              illegal=sum(d.get("illegal_games",0) for d in ds)
              s=(w+0.5*dr)/n; se=math.sqrt(max(s*(1-s),1e-12)/n)
              lo=max(0,s-1.96*se); hi=min(1,s+1.96*se)
              r={"level":lv,"games":n,"wins_self":w,"draws":dr,"losses_self":l,
                 "score_self":s,"score_self_ci95_normal":[lo,hi],"illegal_games":illegal}
              payload["results"][str(lv)]=r
              lines.append(f"| {lv} | {w}-{dr}-{l} | {s:.1%} | {lo:.1%}–{hi:.1%} |")
              if illegal: raise SystemExit(f"L{lv}: illegal games={illegal}")
          Path("build/full-ladder-summary.md").write_text("\n".join(lines)+"\n")
          Path("build/full-ladder-analysis.json").write_text(json.dumps(payload,ensure_ascii=False,indent=2)+"\n")
          print("\n".join(lines))
          PY
          cat build/full-ladder-summary.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: full-ladder-analysis
          path: |
            build/full-ladder-summary.md
            build/full-ladder-analysis.json
          retention-days: 365
