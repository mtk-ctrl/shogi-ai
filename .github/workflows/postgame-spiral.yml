name: Postgame Automatic Spiral
run-name: "Spiral ${{ inputs.cycle_id || 'launcher' }}"
on:
  push:
    branches: [main]
    paths: [".github/postgame-spiral-request.json"]
  pull_request:
    paths:
      - "tools/research/postgame_*.py"
      - "tests/test_postgame_*.py"
      - ".github/scripts/run_postgame_spiral.py"
      - ".github/scripts/inspect_postgame_spiral.py"
      - ".github/workflows/postgame-spiral.yml"
      - "research/self-improvement-20261017/replay_progress.py"
      - "research/self-improvement-20261017/knowledge_fixture.py"
      - "research/self-improvement-20261017/knowledge_saved_review.py"
      - "research/self-improvement-20261017/knowledge_route_fixture.py"
      - "research/self-improvement-20261017/verify_followup_saved.py"
      - "research/self-improvement-20261017/followup-observations.json"
      - ".github/scripts/run_postgame_knowledge_match.py"
      - ".github/scripts/publish_postgame_followup.py"
      - ".github/scripts/run_postgame_practice.py"
      - ".github/scripts/run_postgame_curriculum.py"
      - "research/self-improvement-20261017/practice_saved.py"
      - "research/self-improvement-20261017/verify_practice_publication.py"
      - "research/self-improvement-20261017/practice-publication.json"
  workflow_dispatch:
    inputs:
      cycle_id:
        description: Frozen bounded research cycle identifier
        type: string
        required: true
      plan_ref:
        description: Immutable commit containing research/postgame-cycles/CYCLE/PLAN.json
        type: string
        required: true
      publication_only:
        description: Publish and verify the saved eight-case follow-up only (no analysis or games)
        type: boolean
        default: false
      practice_only:
        description: Execute one frozen saved-position or phase/opponent curriculum trial with audit and publication
        type: boolean
        default: false
      inspect_only:
        description: Read back completed cycle only; no new games or learning
        type: boolean
        default: false
      repair:
        description: Resume only after investigating a saved failure or audit-only repair
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: postgame-automatic-spiral-controller
  cancel-in-progress: false
jobs:
  code-ci:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - run: python3 -m pip install python-shogi==1.1.1
      - run: python3 -m unittest discover -s tests -p 'test_postgame_*.py'
      - name: Reproduce research yield from immutable saved diagnoses
        run: python3 research/self-improvement-20261017/replay_progress.py --download --output build/postgame-progress-replay.json
      - name: Verify knowledge preparation against exact saved source binaries
        run: python3 research/self-improvement-20261017/knowledge_saved_review.py --directory build/knowledge-saved-review --download --output build/postgame-knowledge-saved-review.json
      - name: Build actual engine for research-knowledge wiring only
        run: python3 scripts/build.py --output build/knowledge-test-engine
      - name: Verify separate A/B knowledge with actual engine and arena
        run: python3 research/self-improvement-20261017/knowledge_fixture.py --binary build/knowledge-test-engine --directory build/knowledge-fixture --output build/postgame-knowledge-wiring.json
      - name: Verify saved follow-up without repeating engine analysis
        run: python3 research/self-improvement-20261017/verify_followup_saved.py --inputs build/followup-originals --download --observations research/self-improvement-20261017/followup-observations.json --output build/postgame-followup-readback.json
      - name: Verify normal-arena research knowledge transport and audit
        run: python3 research/self-improvement-20261017/knowledge_route_fixture.py --binary build/knowledge-test-engine --directory build/knowledge-route-fixture --output build/postgame-knowledge-route.json
      - name: Verify saved practice without new games or engine analysis
        run: python3 research/self-improvement-20261017/verify_practice_publication.py --directory build/practice-readback --originals build/practice-originals --output build/postgame-practice-readback.json
      - run: python3 scripts/check_workflow_inventory.py --strict && python3 scripts/check_match_workflows.py
      - uses: actions/upload-artifact@v4
        with:
          name: postgame-progress-replay-${{ github.run_id }}
          path: |
            build/postgame-progress-replay.json
            build/postgame-knowledge-wiring.json
            build/postgame-knowledge-saved-review.json
            build/postgame-followup-readback.json
            build/postgame-knowledge-route.json
            build/postgame-practice-readback.json
          retention-days: 90
  launch-request:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions: {contents: read, actions: write}
    steps:
      - uses: actions/checkout@v5
      - run: python3 -m pip install python-shogi==1.1.1
      - name: Dispatch explicit manual controller entry
        env: {GH_TOKEN: "${{ github.token }}"}
        run: python3 .github/scripts/run_postgame_spiral.py --launch
  control:
    if: github.event_name == 'workflow_dispatch' && !inputs.inspect_only && !inputs.publication_only && !inputs.practice_only
    runs-on: ubuntu-latest
    timeout-minutes: 360
    permissions: {contents: write, actions: write}
    steps:
      - uses: actions/checkout@v5
        with: {ref: main}
      - run: python3 -m pip install python-shogi==1.1.1
      - name: Validate workflow inputs before any heavy work
        run: python3 scripts/check_match_workflows.py
      - name: Advance enrolled cycle and persist verified receipts
        env:
          GH_TOKEN: "${{ github.token }}"
          CYCLE_ID: "${{ inputs.cycle_id }}"
          PLAN_REF: "${{ inputs.plan_ref }}"
          REPAIR: "${{ inputs.repair }}"
        run: python3 .github/scripts/run_postgame_spiral.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: postgame-spiral-${{ github.run_id }}-a${{ github.run_attempt }}
          path: |
            build/postgame-spiral/report.json
            build/postgame-spiral/latest-state.json
            build/postgame-spiral/practice-*/
          if-no-files-found: ignore
          retention-days: 90
  inspect:
    if: github.event_name == 'workflow_dispatch' && inputs.inspect_only && !inputs.publication_only && !inputs.practice_only
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions: {contents: read, actions: read}
    steps:
      - uses: actions/checkout@v5
        with: {ref: main}
      - run: python3 -m pip install python-shogi==1.1.1
      - name: Independently read back completed saved cycle
        env:
          GH_TOKEN: "${{ github.token }}"
          CYCLE_ID: "${{ inputs.cycle_id }}"
          PLAN_REF: "${{ inputs.plan_ref }}"
        run: python3 .github/scripts/inspect_postgame_spiral.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: postgame-spiral-inspection-${{ github.run_id }}
          path: build/postgame-spiral-inspection/readback.json
          if-no-files-found: ignore
          retention-days: 90

  publish-followup:
    if: github.event_name == 'workflow_dispatch' && inputs.publication_only && !inputs.inspect_only && !inputs.practice_only
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions: {contents: write}
    steps:
      - uses: actions/checkout@v5
        with: {ref: main}
      - run: python3 -m pip install python-shogi==1.1.1
      - name: Verify observations and save selected research with retrieved hash
        env:
          GH_TOKEN: "${{ github.token }}"
          CYCLE_ID: "${{ inputs.cycle_id }}"
          PLAN_REF: "${{ inputs.plan_ref }}"
        run: python3 .github/scripts/publish_postgame_followup.py
      - uses: actions/upload-artifact@v4
        with:
          name: "postgame-followup-publication-${{ github.run_id }}"
          path: build/followup-publication
          retention-days: 90
          if-no-files-found: error

  practice:
    if: github.event_name == 'workflow_dispatch' && inputs.practice_only && !inputs.inspect_only && !inputs.publication_only && !inputs.repair
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions: {contents: write, actions: read}
    steps:
      - uses: actions/checkout@v5
        with: {ref: main}
      - run: python3 -m pip install python-shogi==1.1.1
      - run: python3 scripts/check_match_workflows.py
      - name: Play frozen full-history practice, reanalyze and publish
        env:
          GH_TOKEN: "${{ github.token }}"
          CYCLE_ID: "${{ inputs.cycle_id }}"
          PLAN_REF: "${{ inputs.plan_ref }}"
        run: python3 .github/scripts/run_postgame_practice.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: postgame-practice-${{ github.run_id }}
          path: build/practice-trial
          retention-days: 90
          if-no-files-found: ignore
