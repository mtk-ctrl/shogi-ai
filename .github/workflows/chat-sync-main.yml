name: Chat Sync Main

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/chat-sync-main.yml"

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Apply agreed changes
        run: python3 scripts/chat_sync_maintenance.py

      - name: Importer syntax check
        run: python3 -m py_compile tools/book/import_arena_games.py

      - name: Opening book pipeline tests
        id: book_tests
        continue-on-error: true
        shell: bash
        run: |
          set +e
          python3 tests/test_opening_book_pipeline.py > build-chat-sync-test.log 2>&1
          status=$?
          cat build-chat-sync-test.log
          exit $status

      - name: Upload test diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chat-sync-test-diagnostics
          path: build-chat-sync-test.log
          retention-days: 1

      - name: Stop on test failure
        if: steps.book_tests.outcome == 'failure'
        run: exit 1

      - name: Verify nightly workflow configuration
        run: |
          grep -Fq 'cron: "5 15 * * *"' .github/workflows/nightly-book-learning.yml
          grep -Fq 'for lane in 0 1 2 3; do' .github/workflows/nightly-book-learning.yml

      - name: Verify documentation boundaries
        run: |
          grep -Fq '00:05 JST開始' docs/22_自前棋譜小規模定跡.md
          grep -Fq '棋力測定専用' README.md
          grep -Fq 'skipped_ineligible_files' tools/book/import_arena_games.py

      - name: Commit synchronized state
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --stat
          git commit -m "docs: synchronize public nightly and learning boundaries"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main

# one-shot trigger 4
