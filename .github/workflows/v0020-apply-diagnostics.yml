name: v0.0.20 Apply Ordering Diagnostics

on:
  push:
    branches: [v0020-ordering-diagnostics]
    paths:
      - "scripts/apply_v0020_diagnostics.py"
      - ".github/workflows/v0020-apply-diagnostics.yml"

permissions:
  contents: write

jobs:
  apply-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout branch
        uses: actions/checkout@v5
        with:
          ref: v0020-ordering-diagnostics
          fetch-depth: 0

      - name: Apply diagnostics patch
        run: python3 scripts/apply_v0020_diagnostics.py

      - name: Build and run iterative search tests
        run: |
          python3 scripts/build.py --search-test --output build/search-test
          ./build/search-test

      - name: Commit tested patch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add engine/strategy/iterative_search.h tests/search_test.cpp
          if git diff --cached --quiet; then
            echo "No code changes to commit"
            exit 0
          fi
          git commit -m "feat: measure alpha-beta cutoff move ranks"
          git push origin HEAD:v0020-ordering-diagnostics
