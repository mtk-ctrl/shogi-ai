name: Migrate clean snapshot

# One-shot clean migration from shogi-ai-old at c5b201a741baa2a3778822071d0e1e32a418d911.
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/migrate-clean-snapshot.yml"

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout new repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Fetch final snapshot from old repository
        shell: bash
        run: |
          set -euo pipefail
          git clone --quiet https://github.com/mtk-ctrl/shogi-ai-old.git /tmp/shogi-ai-old
          git -C /tmp/shogi-ai-old checkout --quiet c5b201a741baa2a3778822071d0e1e32a418d911
          test "$(git -C /tmp/shogi-ai-old rev-parse HEAD)" = "c5b201a741baa2a3778822071d0e1e32a418d911"

      - name: Replace non-workflow files with clean snapshot
        shell: bash
        run: |
          set -euo pipefail
          rsync -a --delete \
            --exclude='.git/' \
            --exclude='.github/workflows/' \
            /tmp/shogi-ai-old/ ./
          test -f README.md
          test -f LICENSE
          test -f journal/2026-10-05_11_Book実戦フィードバック学習と移転前停止.md
          git status --short

      - name: Commit clean non-workflow snapshot
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: import clean snapshot c5b201a except workflows [skip ci]"
          git push origin HEAD:main
