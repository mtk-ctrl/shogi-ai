name: Migrate clean snapshot

# One-shot clean migration from shogi-ai-old at c5b201a741baa2a3778822071d0e1e32a418d911.
# Trigger this file once to stage workflow blobs outside .github/workflows.
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/migrate-clean-snapshot.yml"

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout new repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Fetch final snapshot from old repository
        shell: bash
        run: |
          set -euo pipefail
          git clone --quiet https://github.com/mtk-ctrl/shogi-ai-old.git /tmp/shogi-ai-old
          git -C /tmp/shogi-ai-old checkout --quiet c5b201a741baa2a3778822071d0e1e32a418d911
          test "$(git -C /tmp/shogi-ai-old rev-parse HEAD)" = "c5b201a741baa2a3778822071d0e1e32a418d911"

      - name: Stage workflow files outside protected path
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .migration-workflows
          mkdir -p .migration-workflows
          cp -a /tmp/shogi-ai-old/.github/workflows/. .migration-workflows/
          test -f .migration-workflows/nightly-book-learning.yml
          test -f .migration-workflows/quick-ci.yml
          git status --short

      - name: Commit staged workflow blobs
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .migration-workflows
          git commit -m "chore: stage workflow snapshot c5b201a [skip ci]"
          git push origin HEAD:main
