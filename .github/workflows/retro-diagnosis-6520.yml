name: Retrospective Diagnosis 6520

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/retro-diagnosis-6520.yml"
      - "tools/research/retro_diagnose_games.py"

permissions:
  contents: read
  actions: read

concurrency:
  group: retrospective-diagnosis-6520
  cancel-in-progress: false

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      SOURCE_RUN_ID: "37349399400"
      SOURCE_ARTIFACT_ID: "11369690131"
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Install dependency
        run: python3 -m pip install python-shogi==1.1.1

      - name: Validate retrospective tool
        run: python3 -m py_compile tools/research/retro_diagnose_games.py

      - name: Build current Champion
        run: python3 scripts/build.py --output build/champion

      - name: Download 6520-game source artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p build/retro/raw build/retro/out build/retro/experience
          curl -fL \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            -o build/retro/source.zip \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${SOURCE_ARTIFACT_ID}/zip"
          unzip -q build/retro/source.zip -d build/retro/raw
          test "$(find build/retro/raw -type f -name '*.json' | wc -l)" -eq 652

      - name: Freeze analysis identity
        run: |
          cat > build/retro/out/run-metadata.json <<EOF
          {
            "analysis_sha": "$(git rev-parse HEAD)",
            "source_run_id": ${SOURCE_RUN_ID},
            "source_artifact_id": ${SOURCE_ARTIFACT_ID},
            "source_artifact_name": "nightly-book-raw-37349399400"
          }
          EOF

      - name: Scan all games and deeply diagnose swing windows
        run: |
          python3 tools/research/retro_diagnose_games.py \
            --input build/retro/raw \
            --engine build/champion \
            --output-dir build/retro/out \
            --expected-games 6520 \
            --expected-plies 875422 \
            --max-window-plies 4 \
            --swing-threshold 300 \
            --deep-intervals 300 \
            --shallow-ms 50 \
            --deep-ms 500 \
            --move-signal 100 \
            --blunder-threshold 150 \
            --good-tolerance 80 \
            --score-gap 200 \
            --experience-file build/retro/experience/retro-6520-experience.bin \
            --learning-ms 500 \
            --warm-verify 100

      - name: Publish report to Actions summary
        if: always()
        run: |
          if [[ -f build/retro/out/report.md ]]; then
            cat build/retro/out/report.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo '# Retrospective Diagnosis 6520' >> "$GITHUB_STEP_SUMMARY"
            echo 'The report was not produced; inspect the failed step logs.' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload diagnosis, Position Bank, problem suite and experience
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: retrospective-diagnosis-6520-${{ github.run_id }}
          path: |
            build/retro/out
            build/retro/experience
          retention-days: 180
