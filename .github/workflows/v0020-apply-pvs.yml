name: v0.0.20 Apply PVS

on:
  push:
    branches: [v0020-pvs]
    paths:
      - "scripts/apply_v0020_pvs.py"
      - ".github/workflows/v0020-apply-pvs.yml"

permissions:
  contents: write

jobs:
  apply-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          ref: v0020-pvs
          fetch-depth: 0
      - name: Apply PVS patch
        run: python3 scripts/apply_v0020_pvs.py
      - name: Build engine and search tests
        run: |
          python3 scripts/build.py --output build/shogi-ai
          python3 scripts/build.py --search-test --output build/search-test
          ./build/search-test
      - name: Commit tested implementation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add engine/strategy/iterative_search.h tests/search_test.cpp
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "feat: add principal variation search"
          git push origin HEAD:v0020-pvs
