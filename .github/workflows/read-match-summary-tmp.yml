name: Read Match Summary (temporary)
# Temporary, branch-only reader: prints one finished Generic Engine Match aggregate as a
# check annotation so it can be read without artifact download. Delete the branch afterwards.
on:
  push:
    branches: [research/read-match-summary-20261108]
permissions:
  actions: read
  contents: read
jobs:
  read:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Download ladder summaries and print
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_IDS: "42456396251 42456617663 42456837855 42457070946 42457323476 42457573299 42457829170 42458069588 42458328235"
        run: |
          for id in $RUN_IDS; do gh run download "$id" -R "$GITHUB_REPOSITORY" -n "yaneuraou-ladder-summary-$id" -D lad_$id; done
          python3 - <<'PY'
          import json, glob
          rows = []
          for f in sorted(glob.glob("lad_*/*.json")):
              d = json.load(open(f))
              rows.append(f"Lv{d['level']}: {d['wins']}W-{d['draws']}D-{d['losses']}L win%={d['win_pct']:.1f} point%={d['point_pct']:.1f} illegal={d['illegal_games']} -> {d['decision']}")
          rows.sort(key=lambda r: int(r.split(':')[0][2:]))
          print("::notice title=ladder::" + "%0A".join(rows))
          PY
