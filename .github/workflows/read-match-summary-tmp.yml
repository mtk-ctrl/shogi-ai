name: Read Match Summary (temporary)
# Temporary, branch-only reader: prints one finished Generic Engine Match aggregate as a
# check annotation so it can be read without artifact download. Delete the branch afterwards.
on:
  push:
    branches: [research/read-match-summary-20261108]
permissions:
  actions: read
  contents: read
jobs:
  read:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Download aggregate and print
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_IDS: "42453154197"
        run: |
          for RUN_ID in $RUN_IDS; do gh run download "$RUN_ID" -R "$GITHUB_REPOSITORY" -n "generic-engine-match-summary-$RUN_ID" -D agg_$RUN_ID; done
          python3 - <<'PY'
          import json, glob
          for f in sorted(glob.glob("agg_*/*.json")):
              d = json.load(open(f))
              keys = ("games","wins_a","wins_b","draws","score_a","illegal_games","average_plies","options_a")
              small = {k: d.get(k) for k in keys if k in d}
              print("::notice title=" + f.split("/")[0] + "::" + json.dumps(small, ensure_ascii=False))
          PY
