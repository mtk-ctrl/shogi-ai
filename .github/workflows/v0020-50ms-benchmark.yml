name: v0.0.20 50ms Benchmark

on:
  push:
    branches: [v0020-ordering-diagnostics]
    paths:
      - ".github/workflows/v0020-50ms-benchmark.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout candidate
        uses: actions/checkout@v5
        with:
          ref: v0020-ordering-diagnostics
          fetch-depth: 0

      - name: Install dependency
        run: python3 -m pip install python-shogi==1.1.1

      - name: Build candidate
        run: python3 scripts/build.py --output build/v0020

      - name: Build v0.0.19 baseline
        shell: bash
        run: |
          set -euo pipefail
          git worktree add --detach /tmp/shogi-v019 5df0efb40d00a07056b4024b84cc4ca430e0a038
          (cd /tmp/shogi-v019 && python3 scripts/build.py --output "$GITHUB_WORKSPACE/build/v019")

      - name: Run 100 games in four lanes
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/v0020-match
          run_lane() {
            lane="$1"
            python3 benchmarks/arena.py \
              --engine-a build/v0020 \
              --engine-b build/v019 \
              --options-a '{"ExperienceCache":"false","OpeningBook":"false"}' \
              --options-b '{"ExperienceCache":"false","OpeningBook":"false"}' \
              --games 25 --max-plies 200 \
              --seed "$((2026102000 + lane * 10000))" \
              --go-command 'go movetime 50' \
              --output "build/v0020-match/lane-${lane}.json"
          }
          pids=()
          for lane in 0 1 2 3; do
            run_lane "$lane" > "build/v0020-match/lane-${lane}.log" 2>&1 &
            pids+=("$!")
          done
          for pid in "${pids[@]}"; do wait "$pid"; done

      - name: Aggregate result
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          rows=[json.loads(p.read_text()) for p in sorted(Path('build/v0020-match').glob('lane-*.json'))]
          games=sum(r['games'] for r in rows)
          wa=sum(r['wins_a'] for r in rows); wb=sum(r['wins_b'] for r in rows); d=sum(r['draws'] for r in rows)
          illegal=sum(r['illegal_games'] for r in rows)
          nodes_a=sum(r.get('search',{}).get('A',{}).get('nodes_total',0) for r in rows)
          nodes_b=sum(r.get('search',{}).get('B',{}).get('nodes_total',0) for r in rows)
          moves_a=sum(r.get('timing_ms',{}).get('A',{}).get('moves',0) for r in rows)
          moves_b=sum(r.get('timing_ms',{}).get('B',{}).get('moves',0) for r in rows)
          out={'games':games,'wins_candidate':wa,'draws':d,'wins_v019':wb,
               'score_candidate':(wa+0.5*d)/games,'illegal_games':illegal,
               'nodes_candidate':nodes_a,'nodes_v019':nodes_b,
               'moves_candidate':moves_a,'moves_v019':moves_b}
          Path('build/v0020-match/summary.json').write_text(json.dumps(out,indent=2)+'\n')
          print(json.dumps(out,indent=2))
          if games != 100 or illegal != 0: raise SystemExit(1)
          PY

      - name: Upload result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v0020-50ms-${{ github.run_id }}
          path: build/v0020-match
          retention-days: 14
