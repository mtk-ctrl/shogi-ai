# 2026-10-15: Completed 5-domain exploratory speed benchmark; retained for reproduction only.
name: Search All Efficiency Research (candidate only)
on:
  push:
    branches: ["research/search-all-optimizations-20261015"]
    paths:
      - ".github/workflows/search-all-efficiency-research.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout candidate (research)
        uses: actions/checkout@v5
      - name: Checkout official v2.0.16 fixed baseline
        uses: actions/checkout@v5
        with:
          ref: 2f3e6b181853161855cf6150256ee330e83e2c3c
          path: official
      - name: Build candidate and official engine
        run: |
          python3 scripts/build.py --output build/candidate-ai
          (cd official && python3 scripts/build.py --output ../build/official-ai)
      - name: Install legal-move independent verifier
        run: python3 -m pip install python-shogi==1.1.1
      - name: Paired fixed-depth and 200ms research benchmark
        run: |
          python3 research/search-all-20261015/benchmark.py \
            build/official-ai build/candidate-ai build/search-all-benchmark.json \
            > build/search-all-benchmark.log 2>&1 || {
              cat build/search-all-benchmark.log
              exit 1
            }
          cat build/search-all-benchmark.log
      - name: Upload independent benchmark results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: search-all-20261015-${{ github.run_id }}
          path: |
            build/search-all-benchmark.json
            build/search-all-benchmark.log
          retention-days: 90
